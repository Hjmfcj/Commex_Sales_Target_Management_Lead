<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AstraZeneca COMEX — Sales &amp; Target Management</title>
<style>
:root{
  --navy:#3c1053; --navy2:#5a1d73; --ink:#1c2333; --muted:#667085; --line:#e3e7ee;
  --bg:#f4f6fa; --card:#ffffff; --teal:#830051; --teal-d:#5e0039; --teal-l:#f8e9f1;
  --green:#1d8a4f; --green-l:#e4f5ec; --amber:#b86e00; --amber-l:#fdf1dc; --red:#c8372d; --red-l:#fbe7e5;
  --blue-l:#efe6f6; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",Tahoma,"Noto Sans Arabic","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:262px 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,var(--navy) 0%,#2b0b3d 100%);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:20px 20px 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.1)}
.brand .mark{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#830051,#d0006f);display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;letter-spacing:-1px}
.brand .wm{font-weight:800;letter-spacing:2px;font-size:13px}
.brand .pn{font-size:12px;opacity:.75;margin-top:1px}
nav{padding:10px 10px 20px;flex:1}
.ng{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.55;padding:14px 12px 6px}
.nb{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:#dbe3ff;text-align:start;padding:9px 12px;border-radius:9px;cursor:pointer;font-size:13.5px}
.nb:hover{background:rgba(255,255,255,.08)}
.nb.on{background:rgba(255,255,255,.16);color:#fff;font-weight:600}
.nb .ic{width:18px;height:18px;flex:none;opacity:.9}
.nb .bd{margin-inline-start:auto;background:var(--teal);color:#fff;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700}
.nb .bd.warn{background:var(--amber)}
.side-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.1);font-size:12px;opacity:.75}
main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:12px 28px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top h1{margin:0;font-size:19px;font-weight:700}
.top .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--teal-l);color:var(--teal-d);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600}
.lang{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 12px;cursor:pointer;font-weight:600}
.lang:hover{background:var(--bg)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--navy2);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.content{padding:24px 28px 60px;max-width:1480px;width:100%}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px}
.card h3{margin:0 0 12px;font-size:15px}
.card .hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card .hd h3{margin:0}
.card .hd .sp{flex:1}
.kpi .lb{color:var(--muted);font-size:12.5px}
.kpi .v{font-size:28px;font-weight:800;margin:4px 0 2px}
.kpi .d{font-size:12px;color:var(--muted)}
.kpi.click{cursor:pointer}.kpi.click:hover{border-color:var(--teal)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{background:var(--bg)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}.btn.pri:hover{background:var(--teal-d)}
.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:7px}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:700;white-space:nowrap}
.b-gray{background:#eef0f4;color:#475467}.b-blue{background:var(--blue-l);color:#5a1d73}.b-green{background:var(--green-l);color:var(--green)}.b-amber{background:var(--amber-l);color:var(--amber)}.b-red{background:var(--red-l);color:var(--red)}.b-teal{background:var(--teal-l);color:var(--teal-d)}
table{width:100%;border-collapse:collapse}
th{background:#f8f9fc;color:#475467;font-size:12px;text-align:start;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid #eef0f4;vertical-align:middle}
tr.row:hover td{background:#fafbfe}
tr.clk{cursor:pointer}
.num{text-align:end;font-variant-numeric:tabular-nums}
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.tw table{min-width:640px}
.bar{height:8px;border-radius:99px;background:#e9edf3;overflow:hidden;min-width:90px}
.bar>i{display:block;height:100%;background:var(--teal);border-radius:99px}
.bar.g>i{background:var(--green)}.bar.a>i{background:var(--amber)}.bar.r>i{background:var(--red)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.toolbar .sp{flex:1}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.fld span{font-weight:600}
input[type=text],input[type=number],input[type=search],select,textarea{border:1px solid #cfd5df;border-radius:8px;padding:7px 10px;background:#fff;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal-l);border-color:var(--teal)}
input.inl{width:110px;text-align:end}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{background:none;border:0;padding:9px 16px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);font-weight:600}
.tab.on{color:var(--teal-d);border-color:var(--teal)}
.stepper{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.st{position:relative;padding:12px 10px;border-radius:12px;background:#f4f6fa;border:1px solid var(--line);text-align:center}
.st .n{width:26px;height:26px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;background:#d6dbe5;color:#fff;font-weight:700;font-size:12px}
.st .l{font-size:12px;font-weight:600}
.st .s{font-size:11px;color:var(--muted);margin-top:2px}
.st.done{background:var(--green-l);border-color:#bfe4cf}.st.done .n{background:var(--green)}
.st.cur{background:var(--teal-l);border-color:#e0b3cc}.st.cur .n{background:var(--teal)}
.st.fail{background:var(--red-l);border-color:#f0bdb8}.st.fail .n{background:var(--red)}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:#fff}
.li.clk{cursor:pointer}.li.clk:hover{border-color:var(--teal)}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600}.li .m{color:var(--muted);font-size:12px}
.dot{width:9px;height:9px;border-radius:50%;background:#98a2b3;flex:none}.dot.g{background:var(--green)}.dot.a{background:var(--amber)}.dot.r{background:var(--red)}.dot.b{background:var(--teal)}
.modal-bg{position:fixed;inset:0;background:rgba(15,26,61,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:16px;width:min(760px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{width:min(980px,100%)}
.mh{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.mh h2{margin:0;font-size:17px;flex:1}
.mh .x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
.mb{padding:18px 20px}
.mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:#fff}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(520px,100%);background:#fff;box-shadow:-10px 0 40px rgba(0,0,0,.2);z-index:90;transform:translateX(110%);transition:transform .25s;display:flex;flex-direction:column}
[dir=rtl] .drawer{transform:translateX(-110%);box-shadow:10px 0 40px rgba(0,0,0,.2)}
.drawer.on{transform:none}
.toast{position:fixed;bottom:24px;inset-inline-start:50%;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:11px;padding:11px 18px;z-index:200;box-shadow:var(--shadow);display:none;max-width:90vw}
.toast.on{display:block}
.empty{padding:34px;text-align:center;color:var(--muted)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13px}
.kv b{color:var(--muted);font-weight:600}
.note{background:var(--teal-l);border:1px solid #e6c4d8;color:#6b0040;border-radius:10px;padding:10px 12px;font-size:13px}
.note.warn{background:var(--amber-l);border-color:#f1d9a5;color:#8a560a}
.note.err{background:var(--red-l);border-color:#f0bdb8;color:#8f2119}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#eef1f7;border-radius:7px;padding:2px 8px;font-size:12px;font-family:Consolas,monospace}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sg{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 9px;font-size:12px;cursor:pointer}
.sg:hover{border-color:var(--teal);background:var(--teal-l)}
.sg.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.sg small{opacity:.75;margin-inline-start:4px}
.logbox{background:#2b0b3d;color:#cfe0ff;border-radius:12px;padding:12px 14px;font-family:Consolas,monospace;font-size:12px;max-height:200px;overflow:auto}
.logbox div{padding:1px 0}
.chart{width:100%}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px}
.split{display:grid;grid-template-columns:300px 1fr;gap:16px}
.pgn{display:flex;gap:6px;align-items:center;justify-content:flex-end;padding:10px}
.inrow{display:flex;gap:8px;align-items:center}
.share-row{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center;margin-bottom:8px}
.price-line{display:flex;justify-content:space-between;padding:8px 10px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g21,.g12,.g3,.split{grid-template-columns:1fr}}
@media (max-width:860px){.app{grid-template-columns:1fr}aside{position:static;height:auto}.stepper{grid-auto-flow:row}.content{padding:16px}.g2{grid-template-columns:1fr}}
@media print{.drawer,.modal-bg,.toast,aside,.top,.toolbar .btn,.no-print{display:none!important}.app{display:block}}
.drawer .mb{flex:1;overflow:auto}
.drawer .mf{justify-content:flex-end}
.drawer .mh{position:static}
textarea{width:100%;resize:vertical}
.mb h3{margin:0 0 8px}
.chip{unicode-bidi:plaintext}
.sg small,.badge,.kpi .v,.num{unicode-bidi:isolate}
.sg small{direction:ltr;display:inline-block}
.btn{white-space:nowrap}
[dir=rtl] .num{direction:ltr;text-align:left}
b,.kpi .v{unicode-bidi:isolate}
#surfBar{position:sticky;top:0;z-index:60;height:46px;display:flex;align-items:center;gap:18px;padding:0 18px;background:#1f0a2e;color:#fff}
#surfBar .sp{flex:1}
.sb-brand{display:flex;align-items:center;gap:10px;font-weight:700}
.sb-prod{opacity:.7;font-size:12px;letter-spacing:.14em}
.sb-tabs{display:flex;gap:4px}
.sb-tabs button{background:none;border:0;color:#d9cce3;padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px}
.sb-tabs button:hover{background:rgba(255,255,255,.08)}
.sb-tabs button.on{background:#830051;color:#fff}
#surfBar .lang{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
#surfBar .lang:hover{background:rgba(255,255,255,.1)}
.azw{font-weight:800;letter-spacing:.01em;color:#830051;font-size:18px}
.azw.lt{color:#fff}
aside{top:46px;height:calc(100vh - 46px)}
.top{top:46px}
.modal-bg{z-index:120}.drawer{top:46px;z-index:110}
/* ===== partner portal & mobile ===== */
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.pt-hero{min-height:calc(100vh - 46px);background:linear-gradient(160deg,#f8e9f1 0%,#fff 55%,#f1eef4 100%);display:grid;place-items:center;padding:30px 16px}
.entry{width:min(720px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:34px}
.entry h1{margin:14px 0 6px;font-size:26px;color:var(--navy)}.entry p{margin:0 0 20px;color:var(--muted)}
.wm2{display:flex;align-items:center;gap:10px}
.ptys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pty{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:start;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:16px;cursor:pointer}
.pty .ic{width:26px;height:26px;color:var(--teal)}.pty b{font-size:15px}.pty span{font-size:12.5px;color:var(--muted)}
.pty:hover{border-color:var(--teal)}.pty.on{border-color:var(--teal);background:var(--teal-l)}
.btn.blk{width:100%;justify-content:center}.btn.big{padding:14px;font-size:15px;border-radius:12px}
.pt-head{background:linear-gradient(90deg,#3c1053,#830051);color:#fff}
.pt-head .wrap{display:flex;align-items:center;gap:14px;padding-top:12px;padding-bottom:12px}
.pt-prod{opacity:.85;border-inline-start:1px solid rgba(255,255,255,.35);padding-inline-start:14px;font-weight:600}
.pt-head .sp{flex:1}.pt-who{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border-radius:999px;padding:5px 14px;font-size:13px}
.pt-who .ic{width:16px;height:16px}.lnk{background:none;border:0;color:#fff;text-decoration:underline;cursor:pointer;font-size:13px}
.pt-nav{padding-top:0!important;padding-bottom:0!important;gap:4px!important;background:rgba(0,0,0,.18);max-width:none;margin:0;padding-inline:max(24px,calc((100% - 1120px)/2 + 24px))!important}
.pt-nav button{display:flex;align-items:center;gap:8px;background:none;border:0;color:#ecdff3;padding:12px 16px;cursor:pointer;font-weight:600;border-bottom:3px solid transparent}
.pt-nav button .ic{width:17px;height:17px}.pt-nav button.on{color:#fff;border-bottom-color:#f0ab00}
.pt-body{padding-top:24px;padding-bottom:60px}.pt-h1{font-size:24px;margin:0 0 16px;color:var(--navy)}
#portal{min-height:calc(100vh - 46px);background:var(--bg)}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px dashed #c9a7bd;border-radius:16px;background:#fdf7fa;padding:30px 16px;text-align:center;cursor:pointer;position:relative;margin-top:14px}
.drop.on,.drop:hover{background:var(--teal-l);border-color:var(--teal)}
.drop .ic{width:34px;height:34px;color:var(--teal)}.drop span{font-size:12.5px;color:var(--muted)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.steps3{display:flex;flex-direction:column;gap:8px}
.s3{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.s3 span{width:24px;height:24px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.pc{margin-top:16px;border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}
.pc-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}.pc-h .ic{width:26px;height:26px;color:var(--teal)}.pc-h .grow{flex:1;min-width:0;word-break:break-all}
.m{color:var(--muted);font-size:12px}
.chips2{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chips2>div{background:#f8f9fc;border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}
.chips2 b{font-size:20px}.chips2 span{font-size:11.5px;color:var(--muted)}.chips2 .bad{background:var(--red-l);border-color:#f0bdb8}.chips2 .bad b{color:var(--red)}
.note.ok{background:var(--green-l);border-color:#bfe4cf;color:#136a3b}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.succ{text-align:center;padding:30px}.succ .tick{width:56px;height:56px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:30px;margin:0 auto 10px}
.succ h2{margin:0 0 6px}.succ p{color:var(--muted);margin:0}
.how{margin:8px 0 0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px;color:#344054}
.tl{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tl>div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);text-align:center}
.tl i{width:28px;height:28px;border-radius:50%;background:#d6dbe5;color:#fff;display:grid;place-items:center;font-style:normal;font-weight:700}
.tl .done i{background:var(--green)}.tl .cur i{background:var(--teal)}.tl .done,.tl .cur{color:var(--ink);font-weight:600}
/* phone */
#mobile{min-height:calc(100vh - 46px);display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,#f8e9f1,#e9e2ee 60%,#d9cfe2);padding:18px}
.phone{width:392px;height:min(800px,calc(100vh - 90px));min-height:640px;background:#f6f3f8;border:10px solid #1f0a2e;border-radius:42px;box-shadow:0 30px 70px rgba(31,10,46,.45);overflow:hidden;display:flex;flex-direction:column;position:relative}
.mtop{background:linear-gradient(90deg,#3c1053,#830051);color:#fff;padding:16px 18px 12px;flex:none}
.mwho{font-size:12.5px;opacity:.85;margin-top:4px}
.mscreen{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.mscreen.entrym{padding:0;background:#fff}.entrym .entry{border:0;box-shadow:none;border-radius:0;padding:26px 18px;width:100%}.entrym .entry h1{font-size:21px}.entrym .ptys{grid-template-columns:1fr}
.mtabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line)}
.mtabs button{background:none;border:0;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#667085;font-size:11px;cursor:pointer}
.mtabs button .ic{width:22px;height:22px}.mtabs button.on{color:var(--teal);font-weight:700}
.mcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.mcard.hero{background:linear-gradient(135deg,#830051,#3c1053);color:#fff;border:0}.mcard.hero .m{color:#f0d3e3}.mcard.hero .v{font-size:26px;font-weight:800;margin:4px 0 8px}
.mh2{display:flex;align-items:center;gap:8px;font-weight:700;margin-top:4px}.mh2 .ic{width:18px;height:18px;color:var(--teal)}
.li2{display:flex;align-items:center;gap:10px;cursor:pointer}.li2 .grow{flex:1;min-width:0}.li2.plain{cursor:default;padding:6px 0;border-bottom:1px solid #f0f1f5}
.succ.ms{background:#fff;border-radius:14px;border:1px solid var(--line)}
.phone .drop{padding:22px 10px}.phone .chips2{grid-template-columns:repeat(2,1fr)}
.phone .btn{white-space:normal}
@media (max-width:560px){.phone{width:100%;height:calc(100vh - 46px);border:0;border-radius:0}#mobile{padding:0}.ptys{grid-template-columns:1fr}.chips2{grid-template-columns:repeat(2,1fr)}.pt-head .wrap{flex-wrap:wrap}}
.btn .ic,.pc-h .ic{flex:none}.btn .ic{width:16px;height:16px}

</style>

/* charts (inline SVG / CSS only) */
const PAL = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300']; // validated categorical order
const BRAND = '#830051';
function barsH(items, opt) {
  opt = opt || {}; const max = opt.max || Math.max(...items.map(i => i.v), 1);
  return `<div class="list" style="gap:10px">${items.map(i => {
    const w = Math.min(100, (i.v / max) * 100); const cls = opt.ach ? (i.v >= 100 ? 'g' : i.v >= 85 ? '' : 'a') : '';
    return `<div><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px"><span>${i.l}</span><b>${opt.ach ? i.v.toFixed(1) + '%' : fmt(i.v)}</b></div><div class="bar ${cls}" style="height:10px"><i style="width:${w}%"></i></div></div>`;
  }).join('')}</div>`;
}
function donut(items) {
  const tot = items.reduce((a, i) => a + i.v, 0) || 1; let off = 0; const r = 52, c = 2 * Math.PI * r;
  const segs = items.map((i, k) => { const len = (i.v / tot) * c; const s = `<circle cx="70" cy="70" r="${r}" fill="none" stroke="${PAL[k % PAL.length]}" stroke-width="22" stroke-dasharray="${len} ${c - len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"><title>${esc(i.l)}: ${(i.v / tot * 100).toFixed(1)}%</title></circle>`; off += len; return s; }).join('');
  return `<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><svg width="140" height="140" viewBox="0 0 140 140">${segs}</svg><div class="legend" style="flex-direction:column;gap:6px;margin:0">${items.map((i, k) => `<span><i style="background:${PAL[k % PAL.length]}"></i>${i.l} — ${(i.v / tot * 100).toFixed(1)}%</span>`).join('')}</div></div>`;
}
function lineChart(labels, series) {
  const W = 520, H = 220, p = 34; const all = series.flatMap(s => s.d); const mx = Math.max(...all) * 1.1, mn = 0;
  const x = i => p + (i * (W - p * 2)) / (labels.length - 1), y = v => H - p - ((v - mn) / (mx - mn)) * (H - p * 2);
  let g = ''; for (let k = 0; k <= 4; k++) { const v = mn + ((mx - mn) * k) / 4; g += `<line x1="${p}" x2="${W - p}" y1="${y(v)}" y2="${y(v)}" stroke="#e5e9f0"/><text x="${p - 6}" y="${y(v) + 4}" font-size="10" fill="#667085" text-anchor="end">${fmt(v / 1000)}k</text>`; }
  const xl = labels.map((l, i) => `<text x="${x(i)}" y="${H - 10}" font-size="10" fill="#667085" text-anchor="middle">${l}</text>`).join('');
  const ls = series.map((s, k) => `<polyline fill="none" stroke="${k ? '#667085' : BRAND}" stroke-width="2.4" ${k ? 'stroke-dasharray="6 4"' : ''} points="${s.d.map((v, i) => x(i) + ',' + y(v)).join(' ')}"/>` + s.d.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${k ? '#667085' : BRAND}"><title>${esc(s.n)} ${labels[i]}: ${fmt(v)}</title></circle>`).join('')).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}${xl}${ls}</svg><div class="legend">${series.map((s, k) => `<span><i style="background:${k ? '#667085' : BRAND}"></i>${s.n}</span>`).join('')}</div>`;
}

/* ---------- mapping ---------- */
function syncRule(f, m) {
  if (m.ruleId) { const i = RULES.findIndex(r => r.id === m.ruleId); if (i >= 0) RULES.splice(i, 1); m.ruleId = null; }
  if (m.rule && m.chosen) {
    const id = 'RL' + (++RLN); RULES.push({ id, raw: m.raw, cust: m.chosen, dist: f.dist, date: '2026-10-04' }); m.ruleId = id;
    let n = 0; FILES.forEach(g => { if (g.dist === f.dist) g.map.forEach(x => { if (x !== m && !x.chosen && x.raw === m.raw) { x.chosen = m.chosen; n++; } }); });
    if (n) toast(t('rule_applied'));
  }
}
A.choose = (fid, mid, cid) => {
  const f = byId(FILES, fid), m = f.map.find(x => x.id === mid); m.chosen = cid || null; syncRule(f, m); render();
  if (cid && !unm(f)) toast(t('map_done'));
};
A.ruleFlag = (fid, mid, on) => { const f = byId(FILES, fid), m = f.map.find(x => x.id === mid); m.rule = on; syncRule(f, m); render(); };
A.acceptTop = fid => { const f = byId(FILES, fid); f.map.forEach(m => { if (!m.chosen && m.sug.length) { m.chosen = m.sug[0].id; syncRule(f, m); } }); render(); toast(t('map_done')); };
A.delRule = id => {
  const i = RULES.findIndex(r => r.id === id); if (i >= 0) RULES.splice(i, 1);
  FILES.forEach(f => f.map.forEach(m => { if (m.ruleId === id) m.ruleId = null; })); render(); toast(t('rule_deleted'));
};

/* ---------- runs ---------- */
A.startRun = () => {
  if (S.run && !S.run.done) return;
  const ids = [...document.querySelectorAll('.rf:checked')].map(x => x.value);
  if (!ids.length) { toast(t('pick_files')); return; }
  const fs = ids.map(i => byId(FILES, i)); const rows = fs.reduce((a, f) => a + f.rows, 0);
  const n = RUNS.filter(r => r.cycle === CUR).length + 1;
  S.run = { id: 'RUN-' + CUR + '-0' + n, step: 0, prog: 0, log: [[nowHMS(), 'lg_start', '', '']], done: false, rows, ids, fi: 0 };
  render(); clearInterval(S.timer); S.timer = setInterval(runTick, 380);
};
function runTick() {
  const r = S.run; if (!r || r.done) { clearInterval(S.timer); return; }
  r.prog += 12 + Math.random() * 10;
  if (r.step === 0) {
    const per = 100 / r.ids.length;
    while (r.fi < r.ids.length && r.prog >= (r.fi + 1) * per * 0.9) { const f = byId(FILES, r.ids[r.fi]); r.log.push([nowHMS(), 'lg_rows', esc(f.name) + ' — ' + fmt(f.rows) + ' ', '']); r.fi++; }
  }
  if (r.prog >= 100) {
    r.prog = 0;
    if (r.step === 0) { r.log.push([nowHMS(), 'lg_refresh', '', '']); r.step = 1; }
    else if (r.step === 1) { r.log.push([nowHMS(), 'lg_recon', '', ': ' + fmt(r.rows) + ' / ' + fmt(r.rows)]); r.step = 2; }
    else {
      r.done = true; r.log.push([nowHMS(), 'lg_done', '', '']);
      r.ids.forEach(i => { byId(FILES, i).uploaded = true; });
      RUNS.unshift({ id: r.id, cycle: CUR, files: r.ids.length, rows: r.rows, rej: 0, dur: '00:' + String(8 + r.ids.length).padStart(2, '0'), status: 'done', date: '2026-10-04 ' + nowHM() });
      if (FILES.every(f => f.uploaded)) S.cycLoaded = true;
      clearInterval(S.timer); toast(t('run_done'));
    }
  }
  if (S.page === 'runs') render(); else renderNav();
}

function shTot() { return S.sh.rows.reduce((a, r) => a + (parseFloat(r.pct) || 0), 0); }
function shOk() { const s = S.sh; const reps = s.rows.map(r => r.rep); return s.rows.length > 0 && Math.abs(shTot() - 100) < 0.005 && new Set(reps).size === reps.length; }
function shUpd() { const ok = Math.abs(shTot() - 100) < 0.005; $('#shTot').innerHTML = badge(ok ? 'green' : 'red', fmt2(shTot()) + '%'); $('#shSave').disabled = !shOk(); }
function drawShares() {
  const s = S.sh;
  openModal(t('edit_shares') + ' — ' + terrName(s.tid), `<div class="note" style="margin-bottom:14px">${t('shares_help')}</div>
  ${s.rows.map((r, i) => `<div class="share-row"><select onchange="A.shRep(${i},this.value)">${REPS.map(x => `<option value="${x.id}" ${x.id === r.rep ? 'selected' : ''}>${esc(nm(x))}</option>`).join('')}</select><div class="inrow"><input type="number" class="inl" style="width:104px" min="0" max="100" step="0.01" value="${r.pct}" oninput="A.shPct(${i},this.value)"><span>%</span><button class="btn sm danger" onclick="A.shDel(${i})" aria-label="${t('delete')}">&times;</button></div></div>`).join('')}
  <div class="toolbar" style="margin-top:12px"><button class="btn sm" onclick="A.shAdd()">+ ${t('add_rep')}</button><button class="btn sm" onclick="A.shEq()">${t('split_equal')}</button><span class="sp"></span><b>${t('total')}:</b> <span id="shTot"></span></div>`,
    `<button class="btn" onclick="A.closeModal()">${t('cancel')}</button><button class="btn pri" id="shSave" onclick="A.shSave()">${t('save')}</button>`); shUpd();
}
A.shRep = (i, v) => { S.sh.rows[i].rep = v; shUpd(); };
A.shPct = (i, v) => { S.sh.rows[i].pct = v; shUpd(); };
A.shDel = i => { S.sh.rows.splice(i, 1); drawShares(); };
A.shAdd = () => { const used = S.sh.rows.map(r => r.rep); const n = REPS.find(r => !used.includes(r.id)); if (n) S.sh.rows.push({ rep: n.id, pct: 0 }); drawShares(); };
A.shEq = () => {
  const n = S.sh.rows.length; if (!n) return; const base = Math.floor(10000 / n) / 100; let rem = Math.round((100 - base * n) * 100) / 100;
  S.sh.rows.forEach((r, i) => { r.pct = i === 0 ? Math.round((base + rem) * 100) / 100 : base; }); drawShares();
};

  const cards = ['pharm', 'rep', 'dist'].map(ty => `<button class="pty ${s.pick === ty ? 'on' : ''}" onclick="A.pPickType('${c}','${ty}')">${ic({ pharm: 'cross', rep: 'user', dist: 'truck' }[ty])}<b>${t('pt_' + ty)}</b><span>${t('ptd_' + ty)}</span></button>`).join('');
  const sel = s.pick ? `<label class="fld" style="margin-top:14px"><span>${t('pt_who')}</span><select onchange="A.pPickId('${c}',this.value)"><option value="">${t('choose')}</option>${listOf(s.pick).map(o => `<option value="${o.id}" ${s.pickId === o.id ? 'selected' : ''}>${esc(nm(o))}</option>`).join('')}</select></label><div style="margin-top:14px"><button class="btn pri blk" ${s.pickId ? '' : 'disabled'} onclick="A.pEnter('${c}')">${t('continue')}</button></div>` : '';
  return `<div class="entry"><div class="wm2">${wordmark()}</div><h1>${t(c === 'm' ? 'en_title_m' : 'en_title_p')}</h1><p>${t('en_sub')}</p><div class="ptys">${cards}</div>${sel}</div>`;
}
const BRANDCFG = { logoSrc: '' };
function wordmark(light) { return BRANDCFG.logoSrc ? `<img src="${BRANDCFG.logoSrc}" alt="AstraZeneca" style="height:26px">` : `<span class="azw${light ? ' lt' : ''}">${t('az_name')}</span>`; }

/* ---------- web portal ---------- */
const PNAV = [['home', 'home', 'pn_home'], ['upload', 'upload', 'pn_upload'], ['history', 'clock', 'pn_history'], ['help', 'help', 'pn_help']];
function renderPortal() {
  const s = U.p, el = $('#portal');
  if (!s.party) { el.innerHTML = `<div class="pt-hero">${entryHtml('p')}</div>`; return; }
  const pa = s.party; const lg = logsFor(pa); const cur = lg.filter(l => l.period === CUR && !l.replaced);
  let body = '';
  if (s.done) {
    body = `<div class="card succ"><div class="tick">✓</div><h2>${t('sent_ok')}</h2><p>${t('sent_sub')}</p><div class="kv" style="max-width:420px;margin:12px auto;text-align:start"><b>${t('receipt')}</b><span>${s.done.rec}</span><b>${t('file')}</b><span>${esc(s.done.name)}</span></div><div><button class="btn pri" onclick="A.pDone('p','history')">${t('pn_history')}</button> <button class="btn" onclick="A.pDone('p','upload')">${t('send_another')}</button></div></div>`;
  } else if (s.page === 'home') {
    const upd = updatesFor(pa); const last = cur[0];
    body = `<div class="grid g3" style="margin-bottom:16px"><div class="card kpi"><div class="lb">${t('cycle')}</div><div class="v" style="font-size:22px">${mLabel(CUR)}</div><div class="d">${last ? xsBadge(last) : badge('amber', t('not_sent'))}</div></div><div class="card kpi"><div class="lb">${t('k_uploads')}</div><div class="v">${cur.length}</div><div class="d">${fmt(cur.reduce((a, l) => a + l.rows, 0))} ${t('rows')}</div></div><div class="card kpi"><div class="lb">${t('k_attn')}</div><div class="v">${updatesFor(pa).filter(u => u.k === 'r').length}</div><div class="d">${t('k_attn_d')}</div></div></div>
    <div class="grid g12"><div class="card"><div class="hd"><h3>${t('send_file')}</h3></div><p style="margin-top:0;color:var(--muted)">${t('send_file_d')}</p><button class="btn pri" onclick="A.pGo('p','upload')">${ic('upload')} ${t('pn_upload')}</button></div>
    <div class="card"><div class="hd"><h3>${t('updates')}</h3></div>${upd.length ? `<div class="list">${upd.map(x => `<div class="li clk" onclick="A.pDetail('p','${x.l.id}')"><span class="dot ${x.k}"></span><div class="grow"><div class="t">${esc(x.l.name)}</div><div class="m">${esc(x.txt)}</div></div></div>`).join('')}</div>` : `<div class="empty">${t('no_updates')}</div>`}</div></div>`;
  } else if (s.page === 'upload') {
    body = `<div class="card">${dropHtml('p')}${s.up ? resultHtml('p') : ''}</div>`;
  } else if (s.page === 'history') {
    body = `<div class="tw"><table><thead><tr><th>${t('file')}</th><th>${t('period')}</th><th class="num">${t('rows')}</th><th>${t('received')}</th><th>${t('status')}</th></tr></thead><tbody>${histRows(pa, 'p')}</tbody></table></div>`;
  } else {
    body = `<div class="grid g2"><div class="card"><div class="hd"><h3>${t('help_tpl')} — ${t('pt_' + pa.type)}</h3><span class="sp"></span><button class="btn sm" onclick="A.pTpl('p','xlsx')">XLSX</button><button class="btn sm" onclick="A.pTpl('p','csv')">CSV</button></div><div class="tw"><table style="min-width:0"><thead><tr><th>${t('field')}</th><th>${t('type')}</th><th>${t('rule')}</th></tr></thead><tbody>${tplRows(pa).map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2] || '—'}</td></tr>`).join('')}</tbody></table></div></div>
    <div class="card"><div class="hd"><h3>${t('help_steps')}</h3></div><ol class="how"><li>${t('how1')}</li><li>${t('how2')}</li><li>${t('how3')}</li><li>${t('how4')}</li></ol></div></div>`;
  }
  const nav = PNAV.map(n => `<button class="${s.page === n[0] && !s.done ? 'on' : ''}" onclick="A.pGo('p','${n[0]}')">${ic(n[1])}<span>${t(n[2])}</span></button>`).join('');
  el.innerHTML = `<div class="pt-head"><div class="wrap"><div class="wm2">${wordmark(true)}</div><span class="pt-prod">${t('portal_name')}</span><span class="sp"></span><span class="pt-who">${ic({ pharm: 'cross', rep: 'user', dist: 'truck' }[pa.type])} ${esc(partyName(pa))} · ${t('pt_' + pa.type)}</span><button class="lnk" onclick="A.pSwitch('p')">${t('switch')}</button></div><div class="wrap pt-nav">${nav}</div></div><div class="wrap pt-body"><h1 class="pt-h1">${s.done ? t('sent_ok') : t(PNAV.find(n => n[0] === s.page)[2])}</h1>${body}</div>`;
}

/* ---------- mobile app ---------- */
const MNAV = [['home', 'home', 'pn_home'], ['upload', 'upload', 'mn_send'], ['history', 'clock', 'pn_history'], ['help', 'help', 'mn_help']];
function renderMobile() {
  const s = U.m, el = $('#mobile');
  let inner;
  if (!s.party) inner = `<div class="mscreen entrym">${entryHtml('m')}</div>`;
  else {
    const pa = s.party; const lg = logsFor(pa); const cur = lg.filter(l => l.period === CUR && !l.replaced); let body = '';
    if (s.done) body = `<div class="succ ms"><div class="tick">✓</div><h2>${t('sent_ok')}</h2><p>${t('sent_sub')}</p><div class="kv" style="grid-template-columns:90px 1fr;text-align:start"><b>${t('receipt')}</b><span>${s.done.rec}</span><b>${t('file')}</b><span style="word-break:break-all">${esc(s.done.name)}</span></div><button class="btn pri blk" style="margin-top:14px" onclick="A.pDone('m','history')">${t('pn_history')}</button><button class="btn blk" style="margin-top:8px" onclick="A.pDone('m','upload')">${t('send_another')}</button></div>`;
    else if (s.page === 'home') {
      const upd = updatesFor(pa); const last = cur[0];
      body = `<div class="mcard hero"><div class="m">${t('cycle')}</div><div class="v">${mLabel(CUR)}</div><div>${last ? xsBadge(last) : badge('amber', t('not_sent'))}</div></div>
      <button class="btn pri blk big" onclick="A.pGo('m','upload')">${ic('upload')} ${t('send_file')}</button>
      <div class="mh2">${ic('bell')} ${t('updates')}</div>${upd.length ? upd.map(x => `<div class="mcard li2" onclick="A.pDetail('m','${x.l.id}')"><span class="dot ${x.k}"></span><div><b>${esc(x.l.name)}</b><div class="m">${esc(x.txt)}</div></div></div>`).join('') : `<div class="mcard empty">${t('no_updates')}</div>`}`;
    } else if (s.page === 'upload') body = `<div class="mcard">${dropHtml('m')}</div>${s.up ? `<div class="mcard">${resultHtml('m')}</div>` : ''}`;
    else if (s.page === 'history') body = lg.map(l => `<div class="mcard li2" onclick="A.pDetail('m','${l.id}')"><div class="grow"><b style="word-break:break-all">${esc(l.name)}</b><div class="m">${mLabel(l.period)} · ${fmt(l.rows)} ${t('rows')}</div></div>${xsBadge(l)}</div>`).join('');
    else body = `<div class="mcard"><b>${t('help_tpl')}</b><div style="margin:10px 0">${tplRows(pa).map(r => `<div class="li2 plain"><div class="grow">${r[0]}<div class="m">${r[1]}${r[2] ? ' · ' + r[2] : ''}</div></div></div>`).join('')}</div><button class="btn blk" onclick="A.pTpl('m','xlsx')">${ic('download')} XLSX</button> <button class="btn blk" style="margin-top:8px" onclick="A.pTpl('m','csv')">${ic('download')} CSV</button></div><div class="mcard"><b>${t('help_steps')}</b><ol class="how"><li>${t('how1')}</li><li>${t('how2')}</li><li>${t('how3')}</li><li>${t('how4')}</li></ol></div><button class="btn blk" onclick="A.pSwitch('m')">${t('switch')}</button>`;
    const tabs = MNAV.map(n => `<button class="${s.page === n[0] && !s.done ? 'on' : ''}" onclick="A.pGo('m','${n[0]}')">${ic(n[1])}<span>${t(n[2])}</span></button>`).join('');
    inner = `<div class="mtop"><div>${wordmark(true)}<div class="mwho">${esc(partyName(pa))}</div></div></div><div class="mscreen">${body}</div><div class="mtabs">${tabs}</div>`;
  }
  el.innerHTML = `<div class="phone">${inner}</div>`;
}

/* ---------- handlers ---------- */
A.pPickType = (c, ty) => { U[c].pick = ty; U[c].pickId = ''; render(); };
A.pPickId = (c, id) => { U[c].pickId = id; render(); };
A.pEnter = c => { const s = U[c]; if (!s.pickId) return; s.party = { type: s.pick, id: s.pickId }; s.page = 'home'; s.up = null; s.done = null; render(); };
A.pSwitch = c => { const s = U[c]; s.replaceId = null; s.party = null; s.pick = ''; s.pickId = ''; s.up = null; s.done = null; render(); };
A.pGo = (c, pg) => { const s = U[c]; s.page = pg; s.done = null; if (pg !== 'upload') { s.up = null; s.replaceId = null; } render(); };
A.pDone = (c, pg) => { U[c].done = null; U[c].replaceId = null; U[c].page = pg; render(); };
A.pPeriod = (c, v) => { const u = U[c].up; if (u) { u.period = v; render(); } else U[c].period = v; };
A.pRound = (c, on) => { U[c].up.round = on; render(); };
A.pClear = c => { U[c].up = null; render(); };
A.pDrop = (e, c) => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) A.pPick_file(c, f); };
A.pPick_file = async (c, file) => {
  if (!file) return; const s = U[c]; const keep = (s.up && s.up.replaces) || s.replaceId; const per = (s.up && s.up.period) || s.period || CUR;
  s.up = { name: file.name, period: per, round: true, busy: true, replaces: keep }; render();
  try {
    const rows = await readSheet(file); s.up.res = precheck(rows, s.party, per); s.up.round = s.up.res.dec.length > 0; s.up.busy = false;
  } catch (e) { s.up.busy = false; s.up.fail = e.message === 'ext' ? 'err_ext' : 'err_read'; }
  render();
};
A.pSubmit = c => { const u = U[c].up; if (!u || !u.res || hasBlock(u.res)) return; submitUpload(c); };
A.pErrCsv = c => { const u = U[c].up; download(csvName('upload_issues'), [[t('row'), t('field'), t('value'), t('issue')], ...u.res.errs.map(e => [e.row, t('f_' + e.field), e.val, t('xe_' + e.type)])]); };
A.pTpl = (c, fm) => {
  const rows = tplData(U[c].party); const base = 'comex_' + U[c].party.type + '_sales_template';
  if (fm === 'csv') return download(base + '.csv', rows);
  const a = document.createElement('a'); a.href = URL.createObjectURL(xlsxBlob(rows)); a.download = base + '.xlsx'; document.body.appendChild(a); a.click(); a.remove();
};
A.pDetail = (c, id) => {
  const pa = U[c].party; const l = logsFor(pa).find(x => x.id === id); if (!l) return; const f = byId(FILES, l.fid); const st = stepOf(l);
  const steps = ['xt_recv', 'xt_match', 'xt_check', 'xt_loaded'];
  const tl = `<div class="tl">${steps.map((k, i) => `<div class="${st === -1 ? (i === 0 ? 'done' : '') : (i + 1 < st ? 'done' : i + 1 === st ? (st === 4 ? 'done' : 'cur') : '')}"><i>${(st !== -1 && (i + 1 < st || st === 4)) || (st === -1 && i === 0) ? '✓' : i + 1}</i><span>${t(k)}</span></div>`).join('')}</div>`;
  const ret = f && f.returned ? `<div class="note err" style="margin:12px 0"><b>${t('xs_returned')}</b><br>${esc(f.returned.reason)}</div>` : '';
  openModal(esc(l.name), `<div class="kv" style="margin-bottom:12px"><b>${t('receipt')}</b><span>${l.id}</span><b>${t('period')}</b><span>${mLabel(l.period)}</span><b>${t('rows')}</b><span>${fmt(l.rows)}</span><b>${t('received')}</b><span><bdi dir="ltr">${l.at}</bdi></span><b>${t('channel')}</b><span>${t('via_' + l.via)}</span><b>${t('status')}</b><span>${xsBadge(l)}</span></div>${tl}${ret}`,
    `<button class="btn" onclick="A.closeModal()">${t('close')}</button>${f && f.returned ? `<button class="btn pri" onclick="A.pReplace('${c}','${l.id}')">${t('up_corrected')}</button>` : ''}`);
};
A.pReplace = (c, id) => { A.closeModal(); const s = U[c]; s.page = 'upload'; s.done = null; s.up = null; s.replaceId = id; const l = PLOG.find(x => x.id === id); s.period = l ? l.period : CUR; render(); };

/* ---------- init ---------- */
document.addEventListener('keydown', e => { if (e.key === 'Escape') { A.closeModal(); A.closeDrawer(); } });
if (/ar/.test(location.hash)) lang = 'ar';
render();


</script>
</body>
</html>
